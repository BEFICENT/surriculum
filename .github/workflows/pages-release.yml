name: GitHub Pages release

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Build-only by default; enable only for an approved release from main
        required: true
        type: boolean
        default: false

# This is intentionally manual: merging or pushing cannot publish a release.
concurrency:
  group: github-pages-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Reject deployment requests outside main
        if: inputs.deploy && github.ref != 'refs/heads/main'
        run: |
          echo "Pages deployment is permitted only from refs/heads/main." >&2
          exit 1

      - name: Verify the checked-in data manifest
        run: python tests/manifest_integrity_test.py

      - name: Build and smoke-test the allowlisted Pages artifact
        run: python scripts/build_pages_artifact.py --output "${{ runner.temp }}/surriculum-pages"

      - name: Upload build-only bundle for inspection
        if: ${{ !inputs.deploy }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: surriculum-pages-review-${{ github.run_id }}
          path: ${{ runner.temp }}/surriculum-pages
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Upload approved release artifact
        if: inputs.deploy && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/surriculum-pages
          retention-days: 1
          include-hidden-files: true

  deploy:
    if: inputs.deploy && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy approved artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
