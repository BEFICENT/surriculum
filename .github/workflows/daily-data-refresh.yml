name: Daily data refresh

on:
  schedule:
    # Runs daily (cron is UTC). Adjust as desired.
    - cron: "20 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh course catalogs (and minors)
        run: |
          python -m tools.data_pipeline.fetch_courses --workers 1 --max-inflight 1 --skip-coursepages

      - name: Refresh requirement rules
        run: |
          python -m tools.data_pipeline.fetch_requirements --skip-minors

      - name: Refresh course page info (credits + offered-term history)
        run: |
          args=(--workers 1 --max-inflight 1)
          if [ "$(date -u +%u)" = "1" ]; then
            args+=(--refresh)
            echo "Course page mode: full"
          else
            echo "Course page mode: incremental"
          fi
          python -m tools.data_pipeline.scrape_coursepages "${args[@]}"

      - name: Refresh schedule data (best-effort)
        run: |
          mode="delta"
          if [ "$(date -u +%u)" = "1" ]; then
            mode="full"
          fi
          echo "Section history mode: $mode"
          python -m tools.data_pipeline.fetch_schedule --section-history-mode "$mode"
        continue-on-error: true

      - name: Normalize known-order JSONL files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def normalize_terms_jsonl(path: Path) -> None:
            if not path.exists():
              return
            rows = []
            for line in path.read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if not line:
                continue
              rec = json.loads(line)
              majors = rec.get("majors")
              if isinstance(majors, list):
                rec["majors"] = sorted(set(map(str, majors)))
              rows.append(rec)
            rows.sort(key=lambda r: str(r.get("term", "")))
            path.write_text("\n".join(json.dumps(r, ensure_ascii=False) for r in rows) + "\n", encoding="utf-8")

          normalize_terms_jsonl(Path("courses/terms.jsonl"))
          PY

      - name: Rebuild the data cache manifest when data changed
        run: |
          if [ -n "$(git status --porcelain -- courses requirements)" ]; then
            python -m tools.data_pipeline.build_manifest
          else
            echo "Data files unchanged; keeping the existing manifest."
          fi

      # Auto-refreshes intentionally do not trigger the full Node/browser CI.
      # Keep fast, data-specific gates here so malformed scraper output can
      # never be proposed for merging merely because the heavy suite was skipped.
      - name: Validate refreshed course rules, requirements, and data manifest
        run: |
          python tests/coursepage_requirements_data_test.py
          python tests/scrape_coursepages_fallback_test.py
          python tests/scrape_groups_test.py
          python tests/requirements_validation_test.py
          python tests/scraper_term_identity_test.py
          python tests/manifest_integrity_test.py

      - name: Preserve an unchanged open refresh pull request
        id: unchanged-pr
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch=bot/daily-data-refresh
          pr_head=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f "head=${GITHUB_REPOSITORY_OWNER}:$branch" -f base=main \
            --jq 'if length == 1 and .[0].head.repo.id == .[0].base.repo.id
                   and .[0].head.ref == "bot/daily-data-refresh"
                   and .[0].user.login == "github-actions[bot]"
                   then .[0].head.sha else empty end')
          if [[ ! "$pr_head" =~ ^[0-9a-f]{40}$ ]]; then
            exit 0
          fi

          # Fetch only the selected PR commit. Do not persist the token in Git config.
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            fetch --no-tags origin "$pr_head"
          parents=$(git show -s --format=%P "$pr_head")
          if [[ "$parents" != "$(git rev-parse HEAD)" ]]; then
            echo 'Refresh PR was not built directly on this base; recomputing normally.'
            exit 0
          fi

          # Model exactly what the PR action would stage, including new and removed
          # files, without touching the real index or the branch being reviewed.
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          export GIT_INDEX_FILE="$scratch/index"
          git read-tree HEAD
          git add -A -- courses requirements data/manifest.json

          # When candidate data returns to main, let the action close the stale PR.
          if git diff --cached --quiet HEAD -- ||
             ! git diff --cached --quiet "$pr_head" -- . ":(exclude)data/manifest.json"; then
            exit 0
          fi

          old_mode=$(git ls-tree "$pr_head" -- data/manifest.json | cut -d" " -f1)
          new_mode=$(git ls-files --stage -- data/manifest.json | cut -d" " -f1)
          if [[ "$old_mode" != 100644 || "$new_mode" != 100644 ]]; then
            exit 0
          fi
          git show "$pr_head:data/manifest.json" > "$scratch/previous.json"
          git show :data/manifest.json > "$scratch/candidate.json"
          if python - "$scratch/previous.json" "$scratch/candidate.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          def manifest(path):
              data = json.loads(Path(path).read_text(encoding="utf-8"))
              if not isinstance(data, dict) or not isinstance(data.pop("generatedAt", None), str):
                  raise ValueError("Missing generatedAt")
              return json.dumps(data, sort_keys=True, separators=(",", ":"))

          try:
              identical = manifest(sys.argv[1]) == manifest(sys.argv[2])
          except (OSError, ValueError):
              identical = False
          sys.exit(0 if identical else 1)
          PY
          then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo 'Refresh data and base are unchanged; preserving the existing PR head and checks.'
          fi

      - name: Create pull request if anything changed
        if: steps.unchanged-pr.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            courses/**
            requirements/**
            data/manifest.json
          branch: bot/daily-data-refresh
          delete-branch: true
          commit-message: "chore(data): daily refresh"
          title: "chore(data): daily refresh"
          body: |
            Automated daily refresh of scraped data (catalogs, requirements, coursepage info, schedule).

            Note: schedule scraping is best-effort; if the university endpoint errors, this workflow still completes.
          labels: data
          assignees: BEFICENT
