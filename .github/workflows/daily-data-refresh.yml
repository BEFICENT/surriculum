name: Daily data refresh

on:
  schedule:
    # Runs daily (cron is UTC). Adjust as desired.
    - cron: "20 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh course catalogs (and minors)
        run: |
          python -m tools.data_pipeline.fetch_courses --workers 1 --max-inflight 1 --skip-coursepages

      - name: Refresh requirement rules
        run: |
          python -m tools.data_pipeline.fetch_requirements --skip-minors

      - name: Refresh course page info (credits + offered-term history)
        run: |
          args=(--workers 1 --max-inflight 1)
          if [ "$(date -u +%u)" = "1" ]; then
            args+=(--refresh)
            echo "Course page mode: full"
          else
            echo "Course page mode: incremental"
          fi
          python -m tools.data_pipeline.scrape_coursepages "${args[@]}"

      - name: Refresh schedule data (best-effort)
        run: |
          mode="delta"
          if [ "$(date -u +%u)" = "1" ]; then
            mode="full"
          fi
          echo "Section history mode: $mode"
          python -m tools.data_pipeline.fetch_schedule --section-history-mode "$mode"
        continue-on-error: true

      - name: Normalize known-order JSONL files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def normalize_terms_jsonl(path: Path) -> None:
            if not path.exists():
              return
            rows = []
            for line in path.read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if not line:
                continue
              rec = json.loads(line)
              majors = rec.get("majors")
              if isinstance(majors, list):
                rec["majors"] = sorted(set(map(str, majors)))
              rows.append(rec)
            rows.sort(key=lambda r: str(r.get("term", "")))
            path.write_text("\n".join(json.dumps(r, ensure_ascii=False) for r in rows) + "\n", encoding="utf-8")

          normalize_terms_jsonl(Path("courses/terms.jsonl"))
          PY

      - name: Rebuild the data cache manifest when data changed
        run: |
          if [ -n "$(git status --porcelain -- courses requirements)" ]; then
            python -m tools.data_pipeline.build_manifest
          else
            echo "Data files unchanged; keeping the existing manifest."
          fi

      # Auto-refreshes intentionally do not trigger the full Node/browser CI.
      # Keep fast, data-specific gates here so malformed scraper output can
      # never be proposed for merging merely because the heavy suite was skipped.
      - name: Validate refreshed course rules, requirements, and data manifest
        run: |
          python tests/coursepage_requirements_data_test.py
          python tests/requirements_validation_test.py
          python tests/scraper_term_identity_test.py
          python tests/manifest_integrity_test.py

      - name: Create pull request if anything changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            courses/**
            requirements/**
            data/manifest.json
          branch: bot/daily-data-refresh
          delete-branch: true
          commit-message: "chore(data): daily refresh"
          title: "chore(data): daily refresh"
          body: |
            Automated daily refresh of scraped data (catalogs, requirements, coursepage info, schedule).

            Note: schedule scraping is best-effort; if the university endpoint errors, this workflow still completes.
          labels: data
          assignees: BEFICENT
